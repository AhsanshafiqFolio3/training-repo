# Bonus for D4-6: every push to main publishes the store to GitHub Pages, at
# https://<user>.github.io/training-repo/. It runs the full check first, so a broken
# main is never deployed. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      # The site lives under /training-repo/, not at the root of the domain.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no "send every path to index.html" setting. For /cart it serves
      # cart.html if there is one, so we give every page people share its own copy of
      # index.html and Pages answers 200. Product ids are prod-0001 to prod-5000
      # (PRODUCT_COUNT in src/mocks/seed-products.ts). Anything else, such as an order
      # page or a typo, gets 404.html: also the app, but with a 404 status.
      - name: Make shared links work
        run: |
          cp dist/index.html dist/404.html
          for page in cart login checkout account; do
            cp dist/index.html "dist/$page.html"
          done
          mkdir -p dist/products
          for n in $(seq 1 5000); do
            cp dist/index.html "dist/products/prod-$(printf '%04d' "$n").html"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
