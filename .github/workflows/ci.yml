# Checks every pull request (and every push to main) the same way `npm run check` does
# locally, plus a production build. If any step fails, the check fails, and branch
# protection on main then blocks the merge (see docs/decisions.md, D4-6).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # npm ci installs exactly what package-lock.json says, and fails if the lock file
      # and package.json disagree.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
